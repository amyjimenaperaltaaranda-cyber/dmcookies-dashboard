<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <!-- Máscara para crear el efecto de recorte (hueco) transparente alrededor de la línea y los nodos -->
    <mask id="cutout">
      <rect width="100%" height="100%" fill="white" />
      <polyline points="30,95 60,65 95,90 125,55 145,70 175,45" stroke="black" stroke-width="14" fill="none" stroke-linejoin="round" />
      <circle cx="30" cy="95" r="11" fill="black" />
      <circle cx="60" cy="65" r="11" fill="black" />
      <circle cx="95" cy="90" r="11" fill="black" />
      <circle cx="125" cy="55" r="11" fill="black" />
      <circle cx="145" cy="70" r="11" fill="black" />
      <circle cx="175" cy="45" r="11" fill="black" />
    </mask>
  </defs>

  <!-- Gráfico de barras de fondo, filtrado por la máscara para no superponerse con el borde de la línea -->
  <g fill="white" mask="url(#cutout)">
    <rect x="42" y="35" width="5" height="70" />
    <rect x="49" y="20" width="5" height="85" />
    <rect x="56" y="10" width="5" height="95" />
    <rect x="63" y="28" width="5" height="77" />
    <rect x="70" y="15" width="5" height="90" />
    <rect x="77" y="30" width="5" height="75" />
    <rect x="84" y="18" width="5" height="87" />
    <rect x="91" y="35" width="5" height="70" />
    <rect x="98" y="12" width="5" height="93" />
    <rect x="105" y="25" width="5" height="80" />
    <rect x="112" y="18" width="5" height="87" />
    <rect x="119" y="45" width="5" height="60" />
    <rect x="126" y="35" width="5" height="70" />
    <rect x="133" y="12" width="5" height="93" />
    <rect x="140" y="10" width="5" height="95" />
    <rect x="147" y="45" width="5" height="60" />
    <rect x="154" y="30" width="5" height="75" />
    <rect x="161" y="10" width="5" height="95" />
  </g>

  <!-- Línea de tendencia y nodos principales -->
  <polyline points="30,95 60,65 95,90 125,55 145,70 175,45" stroke="white" stroke-width="6" fill="none" stroke-linejoin="round" />
  <circle cx="30" cy="95" r="7" fill="white" />
  <circle cx="60" cy="65" r="7" fill="white" />
  <circle cx="95" cy="90" r="7" fill="white" />
  <circle cx="125" cy="55" r="7" fill="white" />
  <circle cx="145" cy="70" r="7" fill="white" />
  <circle cx="175" cy="45" r="7" fill="white" />
</svg>
