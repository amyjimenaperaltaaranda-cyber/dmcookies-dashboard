<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Lente de la lupa / Galleta mordida -->
  <!-- El trazo principal dibuja 3/4 de círculo y luego una mordida hacia adentro -->
  <path d="M 40 15 A 25 25 0 1 0 65 40 A 18 18 0 0 0 40 15" />
  
  <!-- Chispas de la galleta -->
  <circle cx="35" cy="30" r="3" fill="white" stroke="none" />
  <circle cx="26" cy="45" r="4" fill="white" stroke="none" />
  <circle cx="45" cy="50" r="2.5" fill="white" stroke="none" />
  <circle cx="32" cy="58" r="2" fill="white" stroke="none" />
  <circle cx="48" cy="33" r="3" fill="white" stroke="none" />
  <circle cx="23" cy="33" r="1.5" fill="white" stroke="none" />
  
  <!-- Mango de la lupa -->
  <!-- Conector pequeño -->
  <line x1="57.7" y1="57.7" x2="63" y2="63" stroke-width="5" />
  <!-- Cuerpo del mango -->
  <line x1="63" y1="63" x2="82" y2="82" stroke-width="8" />
  <!-- Base del mango (tope) -->
  <line x1="80" y1="84" x2="84" y2="80" stroke-width="4" />
</svg>
